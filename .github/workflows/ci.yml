name: CI

# Run the repo's own suite on every push and pull request.
#
# This did not exist, and the cost of that was concrete: `npm run check:server`,
# the check written specifically to catch a backend that cannot boot, was itself
# failing on main and had been for a while. Three unmounted files from the old
# pre-Supabase auth stack required packages that are not in server/package.json.
# Nothing ran the suite, so nothing said so.
#
# `npm test` discovers every check:* and test:* script from package.json, so new
# tests are covered here the moment they exist, with no edit to this file.
on:
  push:
  pull_request:

jobs:
  checks:
    runs-on: ubuntu-latest
    # A window check that never quits would otherwise hold the runner for the
    # six hour default.
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: |
            package-lock.json
            server/package-lock.json

      # The window checks (check:seal, check:matches and ten more) boot the real
      # app under Electron, so the binary is needed. It used to be skipped on
      # the belief that the suite only require()s plain modules, and every one
      # of those checks then failed on "Electron failed to install correctly",
      # which kept this job red on every push and hid whatever else broke.
      - name: Install client dependencies
        run: npm ci

      # check:server loads every server module, so the backend's own
      # dependencies have to be present or it reports a false failure.
      - name: Install server dependencies
        run: npm ci
        working-directory: server

      # Chromium's sandbox needs an unprivileged user namespace, which Ubuntu
      # 24.04's AppArmor refuses by default, and Electron exits at launch
      # without one.
      - name: Allow Electron's sandbox
        run: |
          if [ -e /proc/sys/kernel/apparmor_restrict_unprivileged_userns ]; then
            sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          fi

      # A runner has no display and the window checks open real windows, so
      # the suite runs on a virtual one, 1920x1080 like the PC the app is
      # built on, under a window manager as every desktop has one: without it
      # a window cannot be minimised, and check:mainwindow minimises one.
      - name: Install a virtual screen and a window manager
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends xvfb openbox

      # A runner has no GPU either, so the two checks that need its hardware
      # video encoder are skipped here, with the reason printed (run-all.js).
      - name: Run checks and tests
        run: xvfb-run --auto-servernum --server-args="-screen 0 1920x1080x24" bash -c 'openbox & sleep 1; npm test'
        env:
          OCCLARA_NO_GPU: '1'
