name: CI (Windows, the whole suite)

# The whole suite on Windows, with the real Electron, on GitHub's machine and
# not on the owner's PC. ci.yml runs on Linux without the Electron binary, so
# every check that boots the app's window fails there by construction; those
# checks, the recorder and the clip playback need a Windows desktop, and until
# this existed the only one was the PC the owner plays on.
#
# It runs when asked for (the Actions tab, or the API) and on every push to
# main or to a branch named ci/... or test/.... Not on every branch: this repo
# is private and a Windows minute is billed at twice a Linux one.
#
# The log and every screenshot the checks wrote are kept as artifacts for 7
# days, so a failing surface can be looked at without running it anywhere.
on:
  workflow_dispatch:
    inputs:
      only:
        description: "Run only these scripts, space separated (for example: check:recorder check:clips). Empty runs the whole suite."
        required: false
        default: ""
  push:
    branches:
      - main
      - 'ci/**'
      - 'test/**'

concurrency:
  group: ci-windows-${{ github.ref }}
  cancel-in-progress: true

jobs:
  suite:
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      # Line endings as they are in the repo, as on the Linux job: with the
      # runner's default every file is checked out with CRLF, and the checks
      # that compare a generated file byte for byte then fail on a clean tree.
      - name: Keep line endings as committed
        run: git config --global core.autocrlf false

      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: |
            package-lock.json
            server/package-lock.json

      # With the Electron binary this time: the window checks boot the real app.
      - name: Install client dependencies
        run: npm ci

      - name: Install server dependencies
        run: npm ci
        working-directory: server

      # The runner's desktop is 1024x768, smaller than the app's own window.
      - name: A 1920x1080 desktop
        shell: pwsh
        run: |
          try { Set-DisplayResolution -Width 1920 -Height 1080 -Force } catch { Write-Host "could not set the resolution: $_" }

      # Windows Server ships without Media Foundation, which Chromium uses for
      # H.264: without it the recorder has no encoder and its checks time out.
      - name: Media Foundation (the H.264 the recorder encodes with)
        shell: pwsh
        run: |
          try { Install-WindowsFeature Server-Media-Foundation | Format-List Success, RestartNeeded, ExitCode } catch { Write-Host "could not install Media Foundation: $_" }

      - name: The machine
        shell: bash
        run: |
          node -v
          npx electron --version
          powershell -NoProfile -Command "Get-CimInstance Win32_VideoController | Select-Object Name, CurrentHorizontalResolution, CurrentVerticalResolution | Format-List"

      # OCCLARA_SHOTS=1 makes check:mainwindow write its pictures of every page.
      - name: Run checks and tests
        shell: bash
        env:
          OCCLARA_SHOTS: '1'
          ONLY: ${{ github.event.inputs.only }}
        run: |
          set -o pipefail
          if [ -z "$ONLY" ] && [ -f .github/ci-only ]; then ONLY="$(cat .github/ci-only)"; fi
          if [ -n "$ONLY" ]; then
            status=0
            for s in $ONLY; do
              echo "===== $s" | tee -a test.log
              npm run "$s" 2>&1 | tee -a test.log || status=1
            done
            exit $status
          else
            npm test 2>&1 | tee test.log
          fi

      - name: Keep the log and the screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: suite-${{ github.sha }}
          retention-days: 7
          if-no-files-found: ignore
          path: |
            test.log
            dist-surface-shots/**
