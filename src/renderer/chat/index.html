<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta http-equiv="Content-Security-Policy"
        content="default-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self';" />
  <title>Ask Coach</title>
  <!-- Before the body: a page of the main window never paints its old window chrome. -->
  <script src="../shared/embed.js"></script>
  <link rel="stylesheet" href="../shared/theme.css" />
  <link rel="stylesheet" href="../shared/ui.css" />
  <link rel="stylesheet" href="../shared/dropdown.css" />
  <link rel="stylesheet" href="chat.css" />
</head>
<body>
  <div class="sheet glass">
    <header class="drag">
      <div class="h-brand">
        <img src="../../../assets/logo-mark.svg" alt="" width="18" height="18" />
        <h2 data-i18n="panel.askCoach">Ask Coach</h2>
      </div>
      <!-- The match this conversation is about (8.5.0): the ten newest of the
           game and general questions, the shared dropdown (shared/dropdown.js). -->
      <div class="h-match no-drag" id="match-pick"></div>
      <button id="close" class="icon-btn no-drag" title="Close" data-i18n-title="common.close"><svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M6 6l12 12"/><path d="M18 6L6 18"/></svg></button>
    </header>

    <div class="body" id="thread" role="log" aria-live="polite">
      <div class="intro" id="intro">
        <p class="intro-lead" data-i18n="chat.lead">Ask about a round, a death or your agent.</p>
        <div class="starters" id="starters"></div>
      </div>
    </div>

    <form class="composer no-drag" id="composer">
      <input id="input" type="text" placeholder="Ask your coach anything" data-i18n-placeholder="chat.placeholder"
             maxlength="500" autocomplete="off" spellcheck="false" />
      <button id="send" class="send" type="submit" title="Send" data-i18n-title="chat.send">
        <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 2 11 13"/><path d="M22 2 15 22l-4-9-9-4Z"/></svg>
      </button>
    </form>
  </div>

  <script src="../shared/dropdown.js"></script>
  <script src="../shared/i18n-apply.js"></script>
  <script src="chat.js"></script>
</body>
</html>
