<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta http-equiv="Content-Security-Policy"
        content="default-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self';" />
  <title>Occlara Home</title>
  <!-- Before the body: the page arms before its first paint (moving between pages). -->
  <script src="../shared/embed.js"></script>
  <link rel="stylesheet" href="../shared/theme.css" />
  <link rel="stylesheet" href="../shared/ui.css" />
  <link rel="stylesheet" href="../shared/grade-view.css" />
  <link rel="stylesheet" href="home.css" />
</head>
<body>
  <!-- HOME, the main window's first page (8.1), THE TRAINING LOG (8.7): the
       fix for the next match set largest, the last match on one ruled line
       with its grade, the grade trend, the recent matches as ruled rows and
       the most repeated mistake as a ruled section. Nothing is framed: a
       hairline and whitespace do the grouping. Every figure is read from the
       library by src/shared/home-model.js, nothing invented, and Valorant's
       rank (8.2.1) from the rank history Stats reads, filled in once the rest
       is painted. The sections keep the class "card" the tests and the
       arrival read them by; the look is the ruled section (home.css). -->
  <main class="home">
    <header class="h-head">
      <div class="h-titles">
        <span id="h-game" class="h-game">Valorant</span>
        <h1>Home</h1>
      </div>
      <!-- No aside (8.7): the games left stand in the rail under Start, and
           the Riot ID's bullet at the rail's foot, said once each. -->
    </header>

    <section id="empty" class="card empty" hidden>
      <h2>No reviewed matches yet</h2>
      <p class="hint">Press Start in the sidebar before your next match. When it ends, its graded review opens here and is kept under Matches.</p>
    </section>

    <div id="content" class="rows" hidden>
      <!-- The rows and the columns are the order home.js keeps (placeRank,
           closeUp): the page lays them out as one column of ruled sections
           (home.css), the focus first, then the last match. -->
      <div class="row">
        <section id="last" class="card last" aria-label="Last match"></section>
        <div id="side" class="col">
          <section id="focus" class="card focus" aria-label="Your next match" hidden>
            <span class="label">Your next match</span>
            <p id="focus-text" class="focus-text"></p>
          </section>
          <section id="rank" class="card rank" aria-label="Rank" hidden>
            <div class="card-head">
              <span class="label">Rank</span>
              <button id="rank-more" class="btn btn-link sm" type="button">Rank journey</button>
            </div>
            <div class="rank-body">
              <div class="rank-now">
                <b id="rank-tier" class="rank-tier"></b>
                <span id="rank-rr" class="rank-rr" title="RR from your last rated game"></span>
              </div>
              <div id="rank-line" class="rank-line" role="img" hidden></div>
            </div>
          </section>
          <section id="top" class="card top" aria-label="Most repeated mistake" hidden>
            <span class="label">Most repeated mistake</span>
            <div class="top-head"><span class="dot" aria-hidden="true"></span><b id="top-title"></b><span id="top-trend" class="trend"></span></div>
            <p id="top-detail" class="hint"></p>
            <p class="fix"><span class="fix-label">Fix</span> <span id="top-fix"></span></p>
            <button id="top-more" class="btn btn-ghost sm" type="button">All your patterns</button>
          </section>
        </div>
      </div>
      <div class="row">
        <!-- The grade trend, and the rank above it when the column beside the
             last match is full (home.js placeRank). -->
        <div id="lower" class="col">
          <section id="trend" class="card trend" aria-label="Grade over the last matches" hidden>
            <div class="card-head">
              <span class="label">Grade, last <span id="trend-n"></span> matches</span>
              <span class="hint" id="trend-avg"></span>
            </div>
            <div id="trend-bars" class="bars" role="img"></div>
          </section>
        </div>
        <section id="recent" class="card recent" aria-label="Recent matches">
          <div class="card-head">
            <span class="label">Recent matches</span>
            <button id="recent-all" class="btn btn-link sm" type="button">All matches</button>
          </div>
          <div id="recent-list" class="recent-list" role="list"></div>
        </section>
      </div>
    </div>
  </main>

  <script src="../shared/grade-view.js"></script>
  <script src="../shared/log-eye.js"></script>
  <script src="home.js"></script>
</body>
</html>
