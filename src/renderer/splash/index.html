<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <!-- font-src is required: theme.css loads the bundled woff2 files, and
       under default-src 'none' they were silently blocked and the wordmark fell
       back to Arial. img-src 'self' is the moon, assets/splash/moon.svg.
       Everything else stays denied. -->
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; img-src 'self'; style-src 'self'; font-src 'self'; base-uri 'none'; form-action 'none'; object-src 'none';" />
  <title>Occlara</title>
  <link rel="stylesheet" href="../shared/theme.css" />
  <link rel="stylesheet" href="splash.css" />
</head>
<body>
  <!-- THE FULL MOON (Nov 2026), clean and simplified: the moon arrives out of
       the night, then the name settles under it. One motion, nothing else.
       The moon is the logo's own clean drawing (assets/splash/moon.svg,
       written by scripts/generate-icon.js from scripts/moon), the same moon
       and the same seas as assets/logo-mark.svg, with its lit edge and its
       soft indigo glow. An <img>, so its filters and blends draw inside the
       picture and the splash draws no gradient of its own. -->
  <div class="stage">
    <img class="moon" src="../../../assets/splash/moon.svg" width="160" height="160" alt="" role="img" aria-label="Occlara" />
    <div class="wordmark">Occlara</div>
  </div>
</body>
</html>
