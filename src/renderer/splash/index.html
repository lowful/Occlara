<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <!-- font-src is required: theme.css loads the bundled Geist woff2 files, and
       under default-src 'none' they were silently blocked and the wordmark fell
       back to Arial. Everything else stays denied. -->
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; img-src 'self'; style-src 'self'; font-src 'self'; base-uri 'none'; form-action 'none'; object-src 'none';" />
  <title>Occlara</title>
  <link rel="stylesheet" href="../shared/theme.css" />
  <link rel="stylesheet" href="splash.css" />
</head>
<body>
  <!-- The moon comes out of its shadow, then the name settles. The mark is
       drawn here as its two circles, the disc and the shade in a mask, so the
       shade can move; it is the same geometry as assets/logo-mark.svg (the
       disc r50 at 62.15,60, the shade r42 at 77.738,51). Change both. -->
  <div class="stage">
    <svg class="mark" viewBox="0 0 120 120" width="96" height="96" role="img" aria-label="Occlara">
      <defs>
        <mask id="phase" maskUnits="userSpaceOnUse" x="0" y="0" width="120" height="120">
          <rect width="120" height="120" fill="white"/>
          <circle class="shade" cx="77.738" cy="51" r="42" fill="black"/>
        </mask>
      </defs>
      <circle cx="62.15" cy="60" r="50" fill="currentColor" mask="url(#phase)"/>
    </svg>
    <div class="wordmark">Occlara</div>
  </div>
</body>
</html>
