<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta http-equiv="Content-Security-Policy"
        content="default-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https://occlara.app; font-src 'self'; media-src 'self' occlara-clip: https://occlara.app; base-uri 'none'; form-action 'none'; object-src 'none';" />
  <title>Occlara Practice</title>
  <!-- Before the body: a page of the main window never paints its old window chrome. -->
  <script src="../shared/embed.js"></script>
  <link rel="stylesheet" href="../shared/theme.css" />
  <link rel="stylesheet" href="../shared/ui.css" />
  <link rel="stylesheet" href="../shared/motion.css" />
  <link rel="stylesheet" href="../review/clip-player.css" />
  <link rel="stylesheet" href="practice.css" />
</head>
<body>
  <!-- THE PRACTICE PAGE (docs/claude/ui.md, "The Practice page"). A plan from
       the player's own repeated mistakes, the ones Patterns lists: the two
       most serious at the top (Your focus), each with how often it repeated,
       whether it is shrinking since the plan was made and the player's own
       newest clip of it; then the drills, grouped under Mechanics, Game sense
       and Awareness (9.1), only the important ones, each saying why it is
       there and opening in place on what to do; the Trainer under Mechanics;
       the log. Every line is main's (src/shared/practice.js planView); this
       page paints. Everything is kept on this PC. Locked by the seal like
       every page.
       SHOWN, NOT ONLY TOLD (8.11): each mistake carries the player's own
       newest kept clip of it, played in the review's own clip player
       (occlara-clip:, main's URL), and a drill may carry a demo from the
       website (https://occlara.app/drills/ only, the one web origin this
       page's CSP allows, for pictures and media alone). -->
  <div class="sheet glass">
    <header class="drag">
      <div class="h-brand">
        <img src="../../../assets/logo-mark.svg" alt="" width="18" height="18" />
        <h2>Practice</h2>
      </div>
      <!-- THE SUB SWITCH (Orbit): the pages this link holds, shared/subnav.js. -->
      <nav class="subnav no-drag" data-group="practice" data-current="practice" aria-label="Practice"></nav>
      <button id="close" class="icon-btn no-drag" title="Close" aria-label="Close"><svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M6 6l12 12"/><path d="M18 6L6 18"/></svg></button>
      <!-- ORBIT: the page's grey sub line under its title. -->
      <p class="page-sub">Drills picked from what keeps repeating in your matches.</p>
    </header>

    <main class="body">
      <!-- Asking main. -->
      <p id="pc-wait" class="pc-wait" aria-live="polite">Reading your matches</p>

      <div id="pc-page" class="pc-page" hidden>
        <!-- League, no drill library, no matches yet, no repeated mistakes yet. -->
        <section id="pc-empty" class="pc-card pc-empty" hidden>
          <h3 id="pc-empty-title" class="pc-empty-title"></h3>
          <p id="pc-empty-hint" class="pc-empty-hint"></p>
        </section>

        <!-- THE REVIEW'S LINK, when its mistake is not in the plan: its drills,
             shown here and not stored. -->
        <section id="pc-asked" class="pc-card pc-asked" hidden aria-labelledby="pc-asked-title">
          <div class="pc-frow pc-asked-head">
            <div class="pc-focus-head">
              <span class="pc-label">From your review</span>
              <h3 id="pc-asked-title" class="pc-focus-title"></h3>
              <p id="pc-asked-line" class="pc-fix" hidden></p>
            </div>
            <!-- The player's own clip of it, when one is kept. -->
            <div id="pc-asked-clip" class="pc-aside" hidden></div>
          </div>
          <div id="pc-asked-drills" class="pc-g-list"></div>
        </section>

        <!-- YOUR FOCUS: the two most serious repeated mistakes, how often, whether
             it is working, the fix and the player's own clip. -->
        <section id="pc-plan" class="pc-card pc-hero" hidden aria-labelledby="pc-plan-title">
          <div class="pc-hero-head">
            <h3 id="pc-plan-title" class="pc-label">Your focus</h3>
            <p id="pc-streak" class="pc-streak" hidden></p>
          </div>
          <div id="pc-focus" class="pc-focus-list"></div>
        </section>

        <!-- The band the drills are sized for, once, above them. -->
        <p id="pc-band-line" class="pc-band" hidden><span id="pc-band"></span> <button id="pc-riot" class="btn btn-link sm" type="button" hidden>Connect your Riot ID</button></p>

        <!-- THE DRILLS, in three groups (9.1): Mechanics with the Trainer, Game
             sense and Awareness, only the important ones. -->
        <div id="pc-groups" class="pc-groups"></div>

        <!-- THE PRACTICE LOG: every drill marked, dated, each one deletable. -->
        <section id="pc-log-sec" class="pc-log-sec" aria-labelledby="pc-log-title">
          <div class="pc-log-head">
            <h3 id="pc-log-title" class="pc-log-title">Practice log</h3>
            <p id="pc-log-streak" class="pc-streak" hidden></p>
          </div>
          <div id="pc-log" class="pc-rows" role="list"></div>
          <p id="pc-log-none" class="pc-quiet" hidden>Nothing marked yet. When you have done a drill, mark it as practiced and it is listed here with its date.</p>
          <button id="pc-log-more" class="btn btn-link sm pc-log-more" type="button" aria-controls="pc-log" aria-expanded="false" hidden></button>
        </section>

        <p id="pc-privacy" class="pc-privacy"></p>
      </div>
    </main>
  </div>

  <script src="../shared/seg.js"></script>
  <script src="../shared/subnav.js"></script>
  <script src="../shared/motion.js"></script>
  <script src="../review/clip-time.js"></script>
  <script src="../review/clip-player.js"></script>
  <script src="practice.js"></script>
</body>
</html>
