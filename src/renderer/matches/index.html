<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta http-equiv="Content-Security-Policy"
        content="default-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self';" />
  <title>Occlara Matches</title>
  <!-- Before the body: a page of the main window never paints its old window chrome. -->
  <script src="../shared/embed.js"></script>
  <link rel="stylesheet" href="../shared/theme.css" />
  <link rel="stylesheet" href="../shared/ui.css" />
  <link rel="stylesheet" href="../shared/motion.css" />
  <link rel="stylesheet" href="../shared/grade-view.css" />
  <link rel="stylesheet" href="matches.css" />
</head>
<body>
  <div class="sheet glass">
    <header class="drag">
      <div class="h-brand">
        <img src="../../../assets/logo-mark.svg" alt="" width="18" height="18" />
        <h2>Matches</h2>
      </div>
      <nav id="tabs" class="tabs no-drag" role="tablist" aria-label="Game"></nav>
      <button id="close" class="icon-btn no-drag" title="Close" aria-label="Close"><svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M6 6l12 12"/><path d="M18 6L6 18"/></svg></button>
    </header>

    <main class="body">
      <!-- ACROSS MATCHES FIRST. One review already says what happened in one
           match; this is the only place that says what keeps happening, which
           is what a player can actually work on between sessions. -->
      <section id="patterns" class="patterns">
        <div class="p-head">
          <div>
            <h3>Your patterns</h3>
            <p id="p-sub" class="hint"></p>
          </div>
          <div id="p-avg" class="p-avg" hidden>
            <span class="p-avg-num" id="p-avg-num"></span>
            <span class="p-avg-label">average grade</span>
          </div>
        </div>
        <div id="p-trend" class="p-trend" hidden></div>
        <div id="p-cats" class="p-cats" hidden></div>
        <div id="p-lists"></div>

        <!-- WHERE AND ON WHAT (folded, 8.7). The patterns say what keeps
             happening; this says on which map and which agent, counted from
             the same saved reviews by src/shared/breakdown.js, every number
             with its sample. It was the Breakdown tab until Moments took its
             place: one closed line at the foot of Patterns now, its table
             whole inside. -->
        <details id="breakdown" class="breakdown" hidden>
          <summary class="b-sum">
            <span class="b-sum-title">By agent, map and queue</span>
            <span id="b-sub" class="b-sum-hint"></span>
          </summary>
          <div class="b-body">
            <!-- The cut and the queue are segmented capsules whose thumb
                 slides (shared/seg.js, occlaraSeg in matches.js). -->
            <div class="b-head">
              <div id="b-dims" class="seg-mini" role="tablist" aria-label="Break down by"></div>
            </div>
            <div id="b-queues" class="b-queues" role="group" aria-label="Queue" hidden></div>
            <!-- The rest of the sample's sentences (why a column is empty), wrapping
                 here rather than cut beside the title above. -->
            <p id="b-sample" class="b-note" hidden></p>
            <div id="b-headline" class="b-headline" hidden></div>
            <p id="b-note" class="b-note" hidden></p>
            <div id="b-table" class="b-table" role="table" aria-label="Breakdown"></div>
            <p id="b-empty" class="empty" hidden></p>
          </div>
        </details>
      </section>

      <section id="every" class="block">
        <div class="l-head">
          <h3>Every match</h3>
          <div id="bf" class="bf" hidden>
            <span id="bf-status" class="bf-status" aria-live="polite"></span>
            <button id="bf-go" class="btn sm bf-go" type="button">Grade my recent matches</button>
          </div>
        </div>
        <!-- PROGRESS V3: the rows beside the grade over the last matches,
             a card of its own on the list page alone (matches.js paintChart). -->
        <div class="every-grid">
          <div id="list" class="list" role="list"></div>
          <aside id="m-chart" class="m-chart" aria-label="Grade over your last matches" hidden>
            <span class="m-chart-label">Grade over your last <span id="m-chart-n"></span></span>
            <div class="m-chart-now"><b id="m-chart-big"></b><span id="m-chart-since" class="m-chart-since"></span></div>
            <div id="m-chart-line" class="m-chart-line"></div>
            <span id="m-chart-avg" class="m-chart-avg"></span>
          </aside>
        </div>
        <p id="empty" class="empty" hidden>No reviewed matches yet. Press Start, play a match, and its graded review lands here when it ends.</p>
      </section>
    </main>
  </div>

  <script src="../shared/i18n-apply.js"></script>
  <script src="../shared/seg.js"></script>
  <script src="../shared/grade-view.js"></script>
  <script src="../shared/log-eye.js"></script>
  <script src="../shared/motion.js"></script>
  <script src="matches.js"></script>
</body>
</html>
