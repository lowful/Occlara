<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta http-equiv="Content-Security-Policy"
        content="default-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:;" />
  <title>Occlara Dock</title>
  <link rel="stylesheet" href="../shared/theme.css" />
  <link rel="stylesheet" href="dock.css" />
</head>
<body>
  <!-- The corner mark: the crescent alone, no status dot, no bubble. Fully
       click-through; restore is Ctrl+Shift+M or the tray, and it is never on
       screen during a match (placeMark). Inline rather than an img so it
       takes currentColor; the same path as assets/logo-mark.svg, so change
       both or they drift. -->
  <div class="dock">
    <svg class="mark" width="26" height="26" viewBox="0 0 120 120" fill="none"
         xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Occlara">
      <path d="M76.294,4.281 A50,50 0 1,0 116.705,74.274 A42,42 0 1,1 76.294,4.281 Z" fill="currentColor"/>
    </svg>
  </div>
  <script src="../shared/i18n-apply.js"></script>
</body>
</html>
