<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta http-equiv="Content-Security-Policy"
        content="default-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https://media.valorant-api.com; connect-src 'self' https://valorant-api.com; font-src 'self'; base-uri 'none'; form-action 'none'; object-src 'none';" />
  <title>Occlara Stats</title>
  <!-- Before the body: a page of the main window never paints its old window chrome. -->
  <script src="../shared/embed.js"></script>
  <link rel="stylesheet" href="../shared/theme.css" />
  <link rel="stylesheet" href="../shared/ui.css" />
  <link rel="stylesheet" href="../shared/motion.css" />
  <link rel="stylesheet" href="stats.css" />
</head>
<body>
  <div class="sheet glass">
    <header class="drag">
      <div class="h-brand">
        <img src="../../../assets/logo-mark.svg" alt="" width="18" height="18" />
        <h2>Stats</h2>
      </div>
      <div class="h-actions">
        <button id="weekly" class="icon-btn no-drag" title="Weekly report" aria-label="Weekly report">
          <svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="17" rx="2"/><path d="M16 2v4M8 2v4M3 10h18"/></svg>
        </button>
        <button id="ailog" class="icon-btn no-drag" title="AI log: what the coach saw and said" aria-label="AI log">
          <svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7-10-7-10-7z"/><circle cx="12" cy="12" r="3"/></svg>
        </button>
        <button id="close" class="icon-btn no-drag" title="Close"><svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M6 6l12 12"/><path d="M18 6L6 18"/></svg></button>
      </div>
    </header>

    <div class="body">
      <!-- Shown INSTEAD of everything below when the selected game has no stats
           source. The dashboard is Valorant shaped end to end, so the honest
           answer for another game is to say so, never to paint Valorant's rank
           and agents under a different game's name. -->
      <section id="nostats" hidden>
        <h3 id="nostats-title"></h3>
        <p id="nostats-body" class="empty"></p>
      </section>

      <!-- The rank on a line of its own, the page's hero, and the five numbers
           under it in columns (stats.js renderCards). -->
      <section id="sec-overview">
        <h3>Overview</h3>
        <div class="cards" id="cards"></div>
        <!-- The rank line's notes open under it by height (.reveal, ui.css). -->
        <div id="rank-reveal" class="reveal" hidden>
          <div class="reveal-clip"><div id="rank-notes" class="rank-notes"></div></div>
        </div>
      </section>

      <!-- The profile's own averages (stats.js renderNumbers): the combat score
           the lead, K/D and damage beside it, the per round numbers as a
           ruled list and where the shots land as one bar. Hidden with none. -->
      <section id="sec-numbers" hidden>
        <div class="sec-head">
          <h3>Your numbers</h3>
          <span id="numbers-span" class="updated"></span>
        </div>
        <div id="numbers-lead" class="nums-lead"></div>
        <div id="numbers-list" class="nums-list"></div>
        <div id="numbers-shots" class="shots" hidden></div>
      </section>

      <section id="sec-agents">
        <h3 id="agents-title">Top agents</h3>
        <div id="agent-tiles" class="agent-tiles"></div>
        <p id="agent-empty" class="empty" hidden>Play a few matches to see your most played agents here.</p>
      </section>

      <!-- Counted from the match list below (stats.js renderMaps), and each
           act from Riot's record (renderActs). Each hidden with none. -->
      <section id="sec-maps" hidden>
        <div class="sec-head">
          <h3>Maps</h3>
          <span id="maps-span" class="updated"></span>
        </div>
        <div id="maps-table" class="ledger" role="table" aria-label="Your results by map"></div>
      </section>

      <section id="sec-acts" hidden>
        <div class="sec-head">
          <h3>Acts</h3>
          <span class="updated">Riot's record, newest first</span>
        </div>
        <div id="acts-table" class="ledger" role="table" aria-label="Your results by act"></div>
      </section>

      <section id="sec-matches">
        <div class="sec-head">
          <h3>Recent matches</h3>
          <div class="sec-tools">
            <span id="updated" class="updated"></span>
            <div class="mode-seg" id="modeseg" role="group" aria-label="Queue">
              <button type="button" data-mode="competitive" class="active">Competitive</button>
              <button type="button" data-mode="unrated">Unrated</button>
            </div>
            <button id="refresh" class="btn sm no-drag">Refresh</button>
          </div>
        </div>
        <div id="match-list" class="list"></div>
        <p id="match-empty" class="empty" hidden></p>
      </section>

      <section id="sec-sessions">
        <h3>Graded matches</h3>
        <div id="session-list" class="list"></div>
        <p id="session-empty" class="empty" hidden>Finish a match with Occlara recording to see its grade here.</p>
      </section>
    </div>
  </div>

  <script src="../shared/i18n-apply.js"></script>
  <!-- For the grade colour only: Graded matches colour a grade by its letter
       exactly as the review, the library and the panel do. -->
  <script src="../shared/grade-view.js"></script>
  <!-- The Competitive / Unrated capsule's sliding thumb. -->
  <script src="../shared/seg.js"></script>
  <!-- Your numbers, Maps and Acts, read safely from what is already fetched. -->
  <script src="../shared/stats-profile.js"></script>
  <script src="../shared/motion.js"></script>
  <script src="stats.js"></script>
</body>
</html>
