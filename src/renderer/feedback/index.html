<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta http-equiv="Content-Security-Policy"
        content="default-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self';" />
  <title>Report a problem</title>
  <!-- Before the body: a page of the main window never paints its old window chrome. -->
  <script src="../shared/embed.js"></script>
  <link rel="stylesheet" href="../shared/theme.css" />
  <link rel="stylesheet" href="../shared/ui.css" />
  <link rel="stylesheet" href="feedback.css" />
</head>
<body>
  <!-- REPORT A PROBLEM (docs/claude/feedback.md). The player says what went
       wrong in their own words, picks a kind, adds up to three pictures
       (picked, pasted or dropped) and sends it. Main checks, downscales and
       recompresses every picture and sends the report with the account's
       own auth, and says every sentence on this page. Opened from the quiet
       icon above the Discord in the sidebar's foot, locked by the seal like
       every page, so nothing here is ever on screen mid match. -->
  <div class="sheet glass">
    <header class="drag">
      <div class="h-brand">
        <img src="../../../assets/logo-mark.svg" alt="" width="18" height="18" />
        <h2>Report a problem</h2>
      </div>
    </header>

    <main class="body">
      <form id="fb-form" class="fb-form" novalidate>
        <!-- One title, the header's (8.8): the page opens on what to do. -->
        <section class="fb-sec fb-lead">
          <p class="fb-lead-line">Tell us what went wrong, in your own words. A picture of it helps us see what you saw.</p>
        </section>

        <section class="fb-sec" aria-labelledby="fb-kind-label">
          <span id="fb-kind-label" class="fb-label">What kind of report</span>
          <!-- Three kinds, so a row of words, not the capsule (8.8). -->
          <div id="fb-kind" class="opts" role="radiogroup" aria-labelledby="fb-kind-label">
            <button type="button" role="radio" data-kind="broke" aria-checked="true">Something broke</button>
            <button type="button" role="radio" data-kind="coaching" aria-checked="false">Wrong coaching</button>
            <button type="button" role="radio" data-kind="idea" aria-checked="false">An idea</button>
          </div>
        </section>

        <section class="fb-sec" aria-labelledby="fb-text-label">
          <label id="fb-text-label" class="fb-label" for="fb-text">What happened</label>
          <textarea id="fb-text" class="fb-text" rows="7" maxlength="4000" spellcheck="true"
                    placeholder="What you did, what you expected, and what happened instead"></textarea>
          <p id="fb-count" class="fb-count" aria-live="off">0 of 4000</p>
        </section>

        <section class="fb-sec" aria-labelledby="fb-pics-label">
          <span id="fb-pics-label" class="fb-label">Pictures, up to 3</span>
          <div id="fb-drop" class="fb-drop">
            <p class="fb-drop-line">Drop pictures here or paste them</p>
            <button id="fb-pick" class="btn btn-secondary sm" type="button">Choose pictures</button>
            <input id="fb-file" type="file" accept="image/png,image/jpeg,image/webp" multiple hidden />
          </div>
          <ul id="fb-pics" class="fb-pics" hidden></ul>
          <p id="fb-pic-said" class="fb-said" aria-live="polite"></p>
        </section>

        <section id="fb-review-sec" class="fb-sec" aria-labelledby="fb-review-label" hidden>
          <span id="fb-review-label" class="fb-label">Your last review</span>
          <div class="fb-row">
            <p id="fb-review-line" class="fb-review-line"></p>
            <div id="fb-review" class="seg" role="group" aria-labelledby="fb-review-label">
              <button type="button" data-review="on" aria-pressed="false">Attach it</button>
              <button type="button" data-review="off" aria-pressed="true">Leave it out</button>
            </div>
          </div>
        </section>

        <section class="fb-sec" aria-labelledby="fb-sent-label">
          <span id="fb-sent-label" class="fb-label">What is sent</span>
          <p id="fb-what" class="fb-hint"></p>
          <p id="fb-facts" class="fb-facts"></p>
          <details class="fb-more">
            <summary>What is never sent</summary>
            <p id="fb-never" class="fb-hint"></p>
          </details>
        </section>

        <section class="fb-sec fb-foot">
          <p id="fb-out" class="fb-hint" hidden></p>
          <div class="fb-actions">
            <button id="fb-send" class="btn btn-primary md" type="submit" disabled>Send report</button>
            <button id="fb-settings" class="btn btn-secondary" type="button" hidden>Open Settings</button>
          </div>
          <p id="fb-said" class="fb-said" aria-live="polite"></p>
        </section>
      </form>

      <!-- Sent: a calm thank you, the report's number and a way back. -->
      <section id="fb-done" class="fb-sec fb-done" hidden>
        <h1 class="fb-hero">Thanks for telling us</h1>
        <p id="fb-done-said" class="fb-hint"></p>
        <p class="fb-label">Report <span id="fb-done-id" class="fb-id"></span></p>
        <div class="fb-actions">
          <button id="fb-again" class="btn btn-secondary" type="button">Send another</button>
          <button id="fb-home" class="btn btn-tertiary" type="button">Back to Home</button>
        </div>
      </section>
    </main>
  </div>

  <script src="../shared/seg.js"></script>
  <script src="feedback.js"></script>
</body>
</html>
