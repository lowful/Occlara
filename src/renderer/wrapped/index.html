<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta http-equiv="Content-Security-Policy"
        content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self'; media-src 'self' occlara-clip:; base-uri 'none'; form-action 'none'; object-src 'none';" />
  <title>Occlara Wrapped</title>
  <link rel="stylesheet" href="../shared/theme.css" />
  <link rel="stylesheet" href="wrapped.css" />
</head>
<body>
  <!-- OCCLARA WRAPPED (docs/claude/wrapped.md). The player's year as a short
       animated story: a view of its own over the whole window, made for one
       showing and closed after it, and closed by the seal the moment a match
       starts, so nothing of it is ever seen or heard mid match. Its look is
       its own, on purpose (ui-rules-ipc.md, "Wrapped's own look"): colour,
       gradients and continuous motion that the rest of the app never uses.
       Every number is main's (src/shared/wrapped.js), every string is set as
       text, and nothing is sent anywhere. -->
  <div id="wr" class="wr" data-state="loading" data-slide="" aria-roledescription="story">
    <canvas id="wr-gl" class="wr-gl" aria-hidden="true"></canvas>
    <div id="wr-fallback" class="wr-fallback" aria-hidden="true"></div>
    <div id="wr-art" class="wr-art" aria-hidden="true"></div>
    <div class="wr-grain" aria-hidden="true"></div>

    <div id="wr-progress" class="wr-progress" role="progressbar" aria-label="Story progress" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0"></div>

    <div class="wr-top">
      <div class="wr-brand" aria-hidden="true">
        <svg viewBox="0 0 120 120" width="20" height="20"><path fill="currentColor" d="M67.444,10.281 A50,50 0 1,0 107.855,80.274 A42,42 0 1,1 67.444,10.281 Z"/></svg>
        <span>Occlara Wrapped</span>
        <span id="wr-sample" class="wr-sample" hidden>Sample year</span>
      </div>
      <div class="wr-controls">
        <button id="wr-pause" class="wr-btn" type="button" aria-label="Pause" title="Pause (P)" aria-keyshortcuts="P">
          <svg class="i-pause" viewBox="0 0 24 24" aria-hidden="true"><rect x="6" y="5" width="4" height="14" rx="1.2"/><rect x="14" y="5" width="4" height="14" rx="1.2"/></svg>
          <svg class="i-play" viewBox="0 0 24 24" aria-hidden="true"><path d="M8 5.2v13.6a.8.8 0 0 0 1.2.7l10.6-6.8a.8.8 0 0 0 0-1.4L9.2 4.5A.8.8 0 0 0 8 5.2z"/></svg>
        </button>
        <button id="wr-mute" class="wr-btn" type="button" aria-label="Mute" title="Mute (M)" aria-keyshortcuts="M">
          <svg class="i-sound" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 9.5h3.2L12 5.6v12.8l-4.8-3.9H4z"/><path class="wave" d="M15.5 9a4.2 4.2 0 0 1 0 6M18 6.6a7.6 7.6 0 0 1 0 10.8" fill="none" stroke-width="1.8" stroke-linecap="round"/></svg>
          <svg class="i-muted" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 9.5h3.2L12 5.6v12.8l-4.8-3.9H4z"/><path d="M16 9.5l5 5M21 9.5l-5 5" fill="none" stroke-width="1.8" stroke-linecap="round"/></svg>
        </button>
        <button id="wr-close" class="wr-btn" type="button" aria-label="Close" title="Close (Esc)" aria-keyshortcuts="Escape">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6.5 6.5l11 11M17.5 6.5l-11 11" fill="none" stroke-width="2" stroke-linecap="round"/></svg>
        </button>
      </div>
    </div>

    <button id="wr-back" class="wr-zone wr-zone-back" type="button" aria-label="Previous" tabindex="-1"></button>
    <button id="wr-next" class="wr-zone wr-zone-next" type="button" aria-label="Next" tabindex="-1"></button>

    <main id="wr-stage" class="wr-stage" aria-live="polite" aria-atomic="true"></main>

    <div class="wr-foot">
      <span id="wr-count" class="wr-count" aria-hidden="true"></span>
      <span id="wr-hint" class="wr-hint">Space or the arrows to move, P to pause, Esc to close</span>
    </div>

    <div id="wr-empty" class="wr-empty" hidden>
      <p id="wr-empty-text"></p>
      <button id="wr-empty-close" class="wr-cta" type="button">Close</button>
    </div>
  </div>

  <script src="gl.js"></script>
  <script src="sound.js"></script>
  <script src="card.js"></script>
  <script src="wrapped.js"></script>
</body>
</html>
