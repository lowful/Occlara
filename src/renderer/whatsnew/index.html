<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta http-equiv="Content-Security-Policy"
        content="default-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self';" />
  <title>What's new</title>
  <!-- Before the body: a page of the main window never paints its old window chrome. -->
  <script src="../shared/embed.js"></script>
  <link rel="stylesheet" href="../shared/theme.css" />
  <link rel="stylesheet" href="../shared/ui.css" />
  <link rel="stylesheet" href="whatsnew.css" />
</head>
<body>
  <!-- WHAT'S NEW (8.8), the changelog as a marked up sheet: each version
       its figures in the margin (version, day, "Your version") and its words
       in the column, its title, one sentence, then what changed as rows,
       each with its kind in a small word. The newest is the page's one hero. Painted at once
       from the copy the app ships with, then refreshed from the server in the
       background, silently. Opened from Settings and from Home's update line,
       never from the sidebar, and locked by the seal like every page. -->
  <div class="sheet glass">
    <header class="drag">
      <div class="h-brand">
        <img src="../../../assets/logo-mark.svg" alt="" width="18" height="18" />
        <h2>What's new</h2>
      </div>
    </header>

    <main class="body">
      <p id="wn-empty" class="wn-empty" hidden>No version notes here yet. They arrive with your next update.</p>
      <div id="wn-list" class="wn-list"></div>
    </main>
  </div>

  <script src="whatsnew.js"></script>
</body>
</html>
