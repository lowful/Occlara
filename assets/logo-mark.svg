<!--
  Occlara mark: a crescent moon, and nothing in it (the player's ask, 8.6).

  Two circles on a 120 unit grid: the disc of radius 50 centred at
  (62.15, 60), less the disc of radius 42 centred 18 further on, 30 degrees
  above the horizontal, at (77.738, 51). The back is 26 units thick, 26 percent of the
  diameter, which keeps it 3.5px at 16px in the tray. The horns face up and to
  the right, so it reads as the moon and not as a C beside a word starting
  with O.

  Its ink is centred, not its disc. The crescent's bounding box, x 12.15 to
  107.85 and y 10 to 110, has its centre exactly at (60, 60), the middle of
  the box (the player's call, 8.7). The disc therefore sits left of and below
  the middle. Before, the disc sat right of and above it, halfway toward the
  centre of area, and the ink read as off centre in every tile.

  It exists in five places, and they change together: this file; the splash,
  which draws it as its two circles with the shade in a mask so the shade can
  move; the corner mark (dock) and the Recording screen (shell), which inline
  this path so they take currentColor; and scripts/generate-icon.js, which
  draws the same two circles by arithmetic for every icon.

  color="#F5F5F7" on the root is load-bearing. Through an <img> an SVG is its
  own document and currentColor resolves against it, so without a default the
  mark falls back to black and is invisible on the dark ground. #F5F5F7 is
  the app's ink, the text token in theme.css.

  No double hyphen anywhere in this comment: XML forbids one inside a
  comment, and the file then fails to parse and every img showing it breaks.
-->
<svg width="120" height="120" viewBox="0 0 120 120" fill="none"
     xmlns="http://www.w3.org/2000/svg" color="#F5F5F7" role="img" aria-label="Occlara">
  <path d="M67.444,10.281 A50,50 0 1,0 107.855,80.274 A42,42 0 1,1 67.444,10.281 Z" fill="currentColor"/>
</svg>
